name: Unit Tests

# Pushes run these tests from the build workflow, ahead of versioning and release; pull requests
# run them here.
on:
  workflow_call:
  pull_request:

# packages: read lets the restore pull PepperDash.ZoomRoom.Sdk from the org GitHub Packages feed.
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Same authentication as the build workflow: PACKAGES_PAT when set (needed when the package is
      # owned by another repo), otherwise GITHUB_TOKEN. The source name matches nuget.config.
      - name: Authenticate GitHub Packages NuGet feed
        shell: pwsh
        env:
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $token = if ($env:PACKAGES_PAT) { $env:PACKAGES_PAT } else { $env:FALLBACK_TOKEN }
          dotnet nuget update source github-pepperdash-beincourt --username "${{ github.actor }}" --password $token --store-password-in-clear-text --configfile nuget.config

      # The test project builds the plugin first (ProjectReference) and loads the built DLL by name.
      - name: Run tests
        run: dotnet test tests -c Release --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      # The tests load the plugin's dependencies from the restored packages (see AssemblyFixture);
      # when they fail, show where the restore put them and what the plugin's deps.json asks for.
      - name: Show package resolution
        if: failure()
        shell: pwsh
        run: |
          Write-Output "NUGET_PACKAGES=$env:NUGET_PACKAGES"
          $assets = Get-Content src/obj/project.assets.json -Raw | ConvertFrom-Json
          $assets.packageFolders.PSObject.Properties.Name | ForEach-Object {
            Write-Output "package folder: $_"
            Get-ChildItem $_ -Directory -Filter 'pepperdash*' -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name): $((Get-ChildItem $_.FullName -Directory).Name -join ', ')" }
          }
          Get-ChildItem src/bin/Release/net8 | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Output
          Select-String -Path src/bin/Release/net8/*.deps.json -Pattern '"path": "pepperdash' | ForEach-Object { $_.Line.Trim() }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 30
