name: Semantic Release

on:
  push:
    branches:
      - main
      - csv-zoom-sandbox
      - csv-zoom-sandbox-v2

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      cplz-filename: ${{ steps.build.outputs.cplz-filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.x'

      - name: Verify .NET installation
        run: dotnet --version

      - name: Restore packages
        run: dotnet restore src/epi-zoom-room.4Series.csproj

      - name: Build plugin
        run: dotnet build src/epi-zoom-room.4Series.csproj -c Release

      - name: Run tests
        continue-on-error: true
        run: dotnet test tests/ -c Release --no-build

      - name: Debug - Find .cplz files
        run: |
          Write-Host "=== Searching for .cplz files ==="
          Get-ChildItem -Recurse -Path "${{ github.workspace }}" -Filter "*.cplz" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
          }
          
          Write-Host ""
          Write-Host "=== Searching for .clz or .cpz files ==="
          Get-ChildItem -Recurse -Path "${{ github.workspace }}" -Filter "*.*lz" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
          }
          
          Write-Host ""
          Write-Host "=== Contents of src/bin/Release ==="
          if (Test-Path "${{ github.workspace }}/src/bin/Release") {
            Get-ChildItem -Recurse -Path "${{ github.workspace }}/src/bin/Release" | Select-Object Name, Extension
          } else {
            Write-Host "src/bin/Release does not exist"
          }

      - name: Create build output directory
        run: |
          $outputDir = "${{ github.workspace }}/build-output"
          New-Item -ItemType Directory -Force -Path $outputDir
          Write-Host "Created: $outputDir"

      - name: Copy .cplz to output (if exists)
        id: build
        run: |
          $outputDir = "${{ github.workspace }}/build-output"
          $cplzFiles = Get-ChildItem -Recurse -Path "${{ github.workspace }}/src" -Filter "*.cplz"
          
          if ($cplzFiles.Count -gt 0) {
            Write-Host "Found $($cplzFiles.Count) .cplz file(s)"
            $cplzFiles | ForEach-Object {
              Copy-Item $_.FullName -Destination $outputDir
              Write-Host "Copied: $($_.Name) to $outputDir"
            }
            echo "cplz-found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "WARNING: No .cplz files found!"
            Write-Host "Checking if build succeeded..."
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -ne 0) {
              Write-Host "Build failed with exit code: $buildExitCode"
            } else {
              Write-Host "Build succeeded, but no .cplz generated"
            }
            echo "cplz-found=false" >> $env:GITHUB_OUTPUT
          }

      - name: List build output
        run: |
          Write-Host "=== Contents of build-output directory ==="
          Get-ChildItem -Path "${{ github.workspace }}/build-output" -Recurse
          Write-Host ""
          Write-Host "=== File count: $(Get-ChildItem -Path "${{ github.workspace }}/build-output" | Measure-Object).Count files"

      - name: Upload build artifacts
        if: steps.build.outputs.cplz-found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cplz-plugin
          path: ${{ github.workspace }}/build-output/*.cplz
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always()  # Run even if build fails, so we can see the error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cplz-plugin
          path: ./dist

      - name: Debug - Check dist directory
        run: |
          echo "=== Contents of dist/ ==="
          ls -la dist/ || echo "dist directory not found or empty"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --ignore-scripts
      
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
